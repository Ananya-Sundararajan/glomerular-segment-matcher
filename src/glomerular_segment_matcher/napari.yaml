name: glomerular-segment-matcher
display_name: Glomerular Segment Matcher
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: glomerular-segment-matcher.get_reader
      python_name: glomerular_segment_matcher._reader:napari_get_reader
      title: Open images and masks with Glomerular Segment Matcher
    - id: glomerular-segment-matcher.write_single_image
      python_name: glomerular_segment_matcher._writer:write_single_image
      title: Save image data with Glomerular Segment Matcher
    - id: glomerular-segment-matcher.make_qwidget
      python_name: glomerular_segment_matcher:SegmentMatcher
      title: Make example QWidget
  readers:
    - command: glomerular-segment-matcher.get_reader
      accepts_directories: true
      filename_patterns: ['*.tif', '*.png']
  writers:
    - command: glomerular-segment-matcher.write_single_image
      layer_types: ['labels*']
      filename_extensions: ['*.tif', '*.png']
  widgets:
    - command: glomerular-segment-matcher.make_qwidget
      display_name: Segment Matcher
  menus:
    napari/layers/segment:
      - command: glomerular-segment-matcher.make_qwidget
